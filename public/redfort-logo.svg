  </g>

  <!-- Wordmark REDFORT -->
  <text x="68" y="38" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="800" letter-spacing="3.5">RED<tspan fill="#F5762E">FORT</tspan></text>
</svg>
